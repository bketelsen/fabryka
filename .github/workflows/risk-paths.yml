# PR triage uses only code and policy from the trusted base commit (ADR-0004).
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: write
    uses: ./.github/workflows/pr-triage.yml
